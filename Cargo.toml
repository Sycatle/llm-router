[package]
name = "llm-router"
version = "0.1.0"
edition = "2024"
description = "Local OpenAI-compatible LLM router: classifier signals, deterministic tier policy, multi-provider fallback"
license = "MIT"

[dependencies]
async-trait = "0.1.92"
axum = "0.8.9"
bytes = "1.12.1"
futures = "0.3.34"
reqwest = { version = "0.13.5", default-features = false, features = ["json", "stream", "rustls"] }
rusqlite = { version = "0.40.2", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tokio = { version = "1.53.1", features = ["full"] }
toml = "1.1.6"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
uuid = { version = "1.26.1", features = ["v4"] }

[dev-dependencies]
tower = "0.5.3"
